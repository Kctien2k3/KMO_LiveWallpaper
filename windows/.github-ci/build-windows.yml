name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish Windows x64 Single-File Executable
      run: |
        dotnet publish windows/KMO_LiveWallpaper.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/win-x64
        copy windows\CaiDat.bat publish\win-x64\
        Compress-Archive -Path publish\win-x64\* -DestinationPath KMO_LiveWallpaper-Windows-x64.zip

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KMO_LiveWallpaper-Windows-x64
        path: KMO_LiveWallpaper-Windows-x64.zip

    - name: Release Windows ZIP on Tag or Main
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: KMO_LiveWallpaper-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
